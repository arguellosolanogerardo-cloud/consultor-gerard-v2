# .streamlit/secrets.toml
# Este archivo no debe contener claves reales en el repositorio.
# Para desplegar en Streamlit Cloud, añade la clave en la interfaz:
# App → Settings → Secrets
# Agrega la entrada (sin comillas):
# GOOGLE_API_KEY = "<TU_API_KEY>"
#
# Localmente, define la variable de entorno o usa un archivo .env (no comiteado):
# GOOGLE_API_KEY=<TU_API_KEY>